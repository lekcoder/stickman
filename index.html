<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

          body {
      background-image: url('images/artem-kniaz-n-K0G3ymYgc-unsplash.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

        #demo {
      width: 380px;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      background: rgba(239, 8, 8, 0.1);
      padding: 10px;
      transition: transform 0.3s ease;
    }

       .button-container {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
     button {
      background: rgba(215, 8, 8, 0.2);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1em;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    </style>
    <img id="demo" src="images/stickman.png" alt="ffffffff" >
    <!-- <img src="images/runner2.gif" alt="">
    <img src="images/fl" alt="">
    <img src="images/fighting.gif" alt="">
    <img src="images/war.gif" alt=""> -->


  <div class="button-container"> <button onclick="run()">🏃‍♂️ run</button> <button onclick="stop()">🧍‍♂️ stop</button>
   <button onclick="jump()"> 🧗‍♀️ jump</button> <button onclick="fight()"> ⚔️ fight</button>
   <button onclick="war()">☢ war</button> </div>

   <script>
    const img= document.getElementById('demo')
    function run(){
        document.getElementById('demo').src='images/runner2.gif'
    }
     function stop(){
        document.getElementById('demo').src='images/stickman.png'
    }
      function jump(){
        document.getElementById('demo').src='images/Flippivotjump.gif'
    }
      function fight(){
        document.getElementById('demo').src='images/fighting.gif'
    }
      function war(){
        document.getElementById('demo').src='images/test.gif'
    }
   </script>
    
</body>
</html>
